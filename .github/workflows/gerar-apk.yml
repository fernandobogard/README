name: Gerar APK OBD Livre - versao 3

on:
  push:
    paths:
      - 'obdlivre-fonte.zip'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - name: Ler arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair codigo-fonte do aplicativo
        run: unzip -q -o obdlivre-fonte.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          (yes || true) | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Android de teste
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OBDLivre-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
