      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O SDK ja existe no runner Ubuntu. Evita instalar o pacote obsoleto 'tools'.
      - name: Preparar SDK Android 35 (corrigido)
        shell: bash
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER" || { echo 'sdkmanager nao encontrado'; exit 1; }
          (yes || true) | "$SDK_MANAGER" --licenses >/dev/null
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
