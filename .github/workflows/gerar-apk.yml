          OBDLIVRE_BASE64
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar SDK Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Entregar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OBDLivre-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
